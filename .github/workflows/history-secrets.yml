name: Git history secret audit
on:
  push:
    branches: [audit/stage7-4-t09]
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          fetch-depth: 0
          persist-credentials: false
      - name: Verify frozen T09 checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          test "$(git rev-parse HEAD^{tree})" = '6d008af76a85926bbe8ec97edd508a251ed89a97'
          git diff --exit-code HEAD --
          printf 'T09_CANDIDATE_COMMIT=%s\nT09_CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Verify pinned scanner and scan reachable history
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scan_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks.XXXXXXXX")"
          trap 'rm -rf -- "$scan_dir"' EXIT
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 9000000 --output "$scan_dir/scanner.tar.gz" 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz'
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$scan_dir/scanner.tar.gz" | sha256sum --check -
          tar -xOzf "$scan_dir/scanner.tar.gz" gitleaks > "$scan_dir/gitleaks"
          chmod 700 "$scan_dir/gitleaks"
          test "$(git rev-parse --is-shallow-repository)" = false
          git log --all --format=%H > "$scan_dir/commits.txt"
          test -s "$scan_dir/commits.txt"
          printf 'REACHABLE_COMMITS %s\n' "$(wc -l < "$scan_dir/commits.txt")"
          printf '[extend]\nuseDefault = true\n' > "$scan_dir/rules.toml"
          touch "$scan_dir/ignore"
          rc=0
          "$scan_dir/gitleaks" git --config "$scan_dir/rules.toml" --gitleaks-ignore-path "$scan_dir/ignore" --ignore-gitleaks-allow --log-opts="--all" --redact=100 --no-banner --no-color --timeout 480 --exit-code 42 --report-format json --report-path "$scan_dir/raw.json" . > "$scan_dir/scanner.log" 2>&1 || rc=$?
          python3 - "$scan_dir/raw.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          from collections import Counter
          path = Path(sys.argv[1])
          rc = int(sys.argv[2])
          if rc not in (0, 42) or not path.is_file():
              print("HISTORY_SCAN_ERROR", rc)
              raise SystemExit(1)
          data = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(data, list):
              raise SystemExit("unexpected scanner result")
          if bool(data) != (rc == 42):
              raise SystemExit("inconsistent scanner status")
          print("HISTORY_FINDINGS", len(data))
          print("RULE_COUNTS", dict(Counter(row.get("RuleID", "unknown") for row in data)))
          raise SystemExit(1 if data else 0)
          PY
