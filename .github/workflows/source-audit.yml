name: SM8750 source audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit_sm8750.py
      - scripts/verify_sm8750_sync.py
      - kernelforge/source_provider.py
      - devices/profiles/oneplus13-pjz110.json
      - devices/profiles/oneplus-ace6-plq110.json
      - manifests/*-sm8750-source.lock.json
      - .github/workflows/source-audit.yml
  schedule:
    - cron: '45 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/audit_sm8750.py "$RUNNER_TEMP/sm8750-audit.json"
      - if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: sm8750-source-audit
          path: ${{ runner.temp }}/sm8750-audit.json
          if-no-files-found: warn
  locked-sync:
    # Standard ubuntu-24.04 has only 14 GB SSD; it cannot satisfy the
    # provisional 35 GiB free-space preflight for a full 35-project sync.
    # Opt in only after configuring an authorized, adequately sized runner.
    if: ${{ ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch') && vars.SM8750_LARGE_RUNNER != '' }}
    runs-on: ${{ vars.SM8750_LARGE_RUNNER }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install distro repo tool
        run: sudo apt-get update && sudo apt-get install -y repo
      - name: Check runner disk before source sync
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          df -i "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          du -sh "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          free_kib=$(df -Pk "$RUNNER_TEMP" | awk 'NR == 2 {print $4}')
          # Provisional floor for this 35-project sync; revise from measured peak use.
          if [ "$free_kib" -lt 36700160 ]; then
            echo "SM8750 sync requires at least 35 GiB free in RUNNER_TEMP; found ${free_kib} KiB" >&2
            exit 1
          fi
      - name: Inspect capacity and sync locked source
        run: |
          df -h "$RUNNER_TEMP"
          df -i "$RUNNER_TEMP"
          python scripts/verify_sm8750_sync.py \
            --lock manifests/oneplus13-pjz110-sm8750-source.lock.json \
            --workspace "$RUNNER_TEMP/sm8750-locked-source" \
            --report "$RUNNER_TEMP/sm8750-locked-sync.json"
      - name: Record capacity after sync attempt
        if: always()
        run: |
          df -h "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          df -i "$RUNNER_TEMP" "$GITHUB_WORKSPACE"
          du -sh "$RUNNER_TEMP/sm8750-locked-source" "$GITHUB_WORKSPACE" 2>/dev/null || true
      - name: Preserve exact sync result and failure log
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: sm8750-locked-sync
          path: |
            ${{ runner.temp }}/sm8750-locked-sync.json
            ${{ runner.temp }}/sm8750-locked-sync.log
          if-no-files-found: warn
          retention-days: 14
