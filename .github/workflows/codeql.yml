name: CodeQL Python analysis
on:
  push:
    branches: [stage1/initial-foundation]
    paths:
      - "kernelforge/**"
      - "scripts/**"
      - ".github/workflows/codeql.yml"
  pull_request:
    branches: [main]
    paths:
      - "kernelforge/**"
      - "scripts/**"
      - ".github/workflows/codeql.yml"
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea
        with:
          category: "/language:python"
