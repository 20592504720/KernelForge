name: Release (disabled stage-one gate)

on:
  workflow_dispatch:
    inputs:
      artifact_path:
        description: Existing validated build artifact path; no stage-one kernel artifact exists
        type: string
        required: true

permissions:
  contents: read

jobs:
  release-gate:
    # The only declared event is workflow_dispatch. This read-only context
    # cannot equal this reserved non-event; inputs cannot enable the job.
    if: ${{ github.event_name == 'kernelforge_release_disabled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "Release is unavailable until real build and artifact validation exist."
