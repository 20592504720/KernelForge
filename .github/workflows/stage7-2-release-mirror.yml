name: Stage 7.2 Release mirror offline regression
on:
  push:
    branches: [stage1/initial-foundation]
    paths:
      - kernelforge/toolchains/release_mirror.py
      - kernelforge/toolchains/manager.py
      - schemas/build.schema.json
      - tests/test_stage7_2_release_mirror.py
      - .github/workflows/stage7-2-release-mirror.yml
  pull_request:
    branches: [main]
    paths:
      - kernelforge/toolchains/release_mirror.py
      - kernelforge/toolchains/manager.py
      - schemas/build.schema.json
      - tests/test_stage7_2_release_mirror.py
      - .github/workflows/stage7-2-release-mirror.yml
permissions:
  contents: read
jobs:
  mirror-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - name: Run offline mocked-API provenance/cache matrix
        run: python -m unittest discover -s tests -p test_stage7_2_release_mirror.py -v
