name: Validate

on:
  push:
    branches: [audit/stage7-4-t09]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: 'df8ce3a0cc16e08c2ea38d5118571508563a6be1'
          persist-credentials: false
      - name: Verify frozen T09 checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'df8ce3a0cc16e08c2ea38d5118571508563a6be1'
          test "$(git rev-parse HEAD^{tree})" = '65d3e00b4858fcfad1378558415f42d268fd2abf'
          git diff --exit-code HEAD --
          printf 'T09_CANDIDATE_COMMIT=%s\nT09_CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - name: Normalize reviewed checkout-only gc.auto setting
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          value="$(git config --local --no-includes --get-all gc.auto)" || rc=$?
          case "$rc" in
            0)
              test "$value" = 0
              git config --local --no-includes --fixed-value --unset-all gc.auto 0
              echo "T09_CHECKOUT_GC_AUTO_REMOVED=0"
              ;;
            1) echo "T09_CHECKOUT_GC_AUTO_ABSENT" ;;
            *) exit "$rc" ;;
          esac
          git diff --exit-code HEAD --
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q kernelforge scripts tests
      - run: python -m kernelforge validate
      - name: Diagnose rejected Git configuration without exposing values
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import subprocess
          from pathlib import Path
          import kernelforge.git_policy as policy
          from scripts.check_repository_text_policy import verify_repo, verify_checkout_matrix
          public = subprocess.run(["git", "help", "--config"], capture_output=True, text=True, check=True, timeout=30)
          known = {k.strip().lower() for k in public.stdout.splitlines()}
          known.update({"extensions.refstorage", "extensions.refstoragepayload", "extensions.relativeworktrees", "extensions.worktreeconfig", "gc.auto", "maintenance.auto", "core.untrackedcache", "core.hookspath", "core.fsmonitor", "core.sparsecheckout", "core.sparsecheckoutcone", "index.version", "index.skiphash", "fetch.recurseSubmodules".lower()})
          original = policy._config
          def inspect(path, env):
              rows = original(path, env)
              for key, value in rows:
                  if not policy._PASSIVE_CONFIG.fullmatch(key):
                      name = key if key in known else "sha256:" + hashlib.sha256(key.encode()).hexdigest()
                      print("T09_REJECTED_KEY", name, "scope", "root" if Path(path).is_relative_to(Path.cwd()) else "fixture", flush=True)
              return rows
          policy._config = inspect
          for name, operation in (("repository", verify_repo), ("checkout_matrix", verify_checkout_matrix)):
              try:
                  operation()
                  print("T09_DIAGNOSTIC", name, "PASS", flush=True)
              except (OSError, ValueError, RuntimeError, subprocess.SubprocessError) as exc:
                  print("T09_DIAGNOSTIC", name, "BLOCKED", type(exc).__name__, flush=True)
          PY
      - name: Check repository text and digest-lock bytes
        run: python scripts/check_repository_text_policy.py
      - run: python -c "import yaml; from pathlib import Path; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in Path('.github/workflows').glob('*.yml')]"
      # Run the full suite on both Windows Pythons. The child is isolated
      # from the workflow console and its exit status is propagated verbatim.
      - name: Run tests (Windows isolated process group)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -u scripts/windows_test_launcher.py
          $code = $LASTEXITCODE
          Write-Host "WINDOWS_SHELL_CHILD_EXIT=$code"
          exit $code
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Record Node 24 Actions smoke evidence
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        shell: bash
        run: |
          printf 'commit=%s\\nrunner=%s\\npython=%s\\n' "$(git rev-parse HEAD)" "$RUNNER_OS" "$(python --version)" > node24-actions-smoke.txt
      - name: Upload Node 24 Actions smoke evidence
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: node24-actions-smoke
          path: node24-actions-smoke.txt
          if-no-files-found: error
          retention-days: 7
