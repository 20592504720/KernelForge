name: Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q kernelforge scripts tests
      - run: python -m kernelforge validate
      - run: python -c "import yaml; [yaml.safe_load(open(p, encoding='utf-8')) for p in ['.github/workflows/validate.yml', '.github/workflows/build.yml', '.github/workflows/release.yml']]"
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: python scripts/windows_test_runner.py
      - name: Run tests (Unix)
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
