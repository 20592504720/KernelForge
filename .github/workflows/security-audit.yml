name: Python dependency security audit
on:
  push:
    branches: [stage1/initial-foundation]
    paths:
      - requirements-dev.txt
      - .github/workflows/security-audit.yml
  pull_request:
    paths:
      - requirements-dev.txt
      - .github/workflows/security-audit.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit resolved development dependencies
        run: python -m pip_audit -r requirements-dev.txt --progress-spinner off --format json --output "$RUNNER_TEMP/dependency-audit.json"
      - name: Retain advisory result (including failure)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dependency-security-audit
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: warn
          retention-days: 14
