name: Python dependency security audit
on:
  push:
    branches: [audit/stage7-4-t09]
    paths-ignore:
      - '.github/workflows/**'

permissions:
  contents: read
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          persist-credentials: false
      - name: Verify frozen T09 checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          test "$(git rev-parse HEAD^{tree})" = '6d008af76a85926bbe8ec97edd508a251ed89a97'
          git diff --exit-code HEAD --
          printf 'T09_CANDIDATE_COMMIT=%s\nT09_CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install pip-audit==2.10.1
      - name: Audit exact locked development dependencies
        run: python -m pip_audit -r requirements-dev.txt --require-hashes --no-deps --progress-spinner off --format json --output "$RUNNER_TEMP/dependency-audit.json"
      - name: Retain advisory result (including failure)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dependency-security-audit
          path: ${{ runner.temp }}/dependency-audit.json
          if-no-files-found: warn
          retention-days: 14

  static-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          persist-credentials: false
      - name: Verify frozen T09 checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          test "$(git rev-parse HEAD^{tree})" = '6d008af76a85926bbe8ec97edd508a251ed89a97'
          git diff --exit-code HEAD --
          printf 'T09_CANDIDATE_COMMIT=%s\nT09_CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python -m pip install bandit==1.9.4
      - name: Inventory all security findings (report-only until individually reviewed)
        run: python -m bandit -r kernelforge scripts -f json --exit-zero -o "$RUNNER_TEMP/bandit.json"
      - name: Summarize findings and fail on scanner errors
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from collections import Counter
          d = json.loads((Path(os.environ["RUNNER_TEMP"]) / "bandit.json").read_text())
          print("BANDIT_FINDINGS", dict(Counter(x["issue_severity"] for x in d["results"])))
          print("BANDIT_ERRORS", len(d["errors"]))
          for x in d["results"]:
              print(x["filename"], x["line_number"], x["test_id"], x["issue_severity"], x["issue_confidence"])
          raise SystemExit(bool(d["errors"]))
          PY
      - name: Retain full findings
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: static-security-findings
          path: ${{ runner.temp }}/bandit.json
          if-no-files-found: error
          retention-days: 14

  dependency-lock-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          persist-credentials: false
      - name: Verify frozen T09 checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '451fb613f3fc0f4e7afbeb648742f60539ec07c4'
          test "$(git rev-parse HEAD^{tree})" = '6d008af76a85926bbe8ec97edd508a251ed89a97'
          git diff --exit-code HEAD --
          printf 'T09_CANDIDATE_COMMIT=%s\nT09_CANDIDATE_TREE=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Generate four-platform wheel evidence without installing wheels
        run: python scripts/dependency_lock_candidate.py "$RUNNER_TEMP/lock-candidate"
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: dependency-lock-review-candidate
          path: ${{ runner.temp }}/lock-candidate/
          if-no-files-found: error
          retention-days: 14
